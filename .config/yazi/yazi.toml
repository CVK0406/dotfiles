[opener]
# Text / code / config files -> Micro in Foot
edit = [
  { run = 'foot -e micro "$@"', block = true, for = "unix" }
]

# System default application
open = [
  { run = 'xdg-open "$1"', orphan = true, for = "unix" }
]

# PDF -> Zathura, fallback to system viewer
pdf = [
  { run = 'zathura "$1"', orphan = true, for = "unix" }
]

# Video / Audio -> MPV, fallback to system player
play = [
  { run = 'mpv "$1"', orphan = true, for = "unix" }
]


[open]
prepend_rules = [
  # Directories -> open inside Yazi
  { url = "*/", use = "open" },

  # Text, code and configuration files -> Micro
  { mime = "text/*", use = "edit" },

  { url = "*.json", use = "edit" },
  { url = "*.toml", use = "edit" },
  { url = "*.yaml", use = "edit" },
  { url = "*.yml", use = "edit" },
  { url = "*.conf", use = "edit" },
  { url = "*.sh", use = "edit" },

  # PDF -> Zathura, fallback to system viewer
  { mime = "application/pdf", use = [ "pdf", "open" ] },

  # Video -> MPV, fallback to system player
  { mime = "video/*", use = [ "play", "open" ] },

  # Audio -> MPV, fallback to system player
  { mime = "audio/*", use = [ "play", "open" ] }
]

# Everything else -> system default application
append_rules = [
  { url = "*", use = "open" }
]
